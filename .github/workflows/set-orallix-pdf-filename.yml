name: Set ORALLIX PDF filename

on:
  push:
    branches:
      - orallix/clinical-report-stationery-v1

permissions:
  contents: write

jobs:
  rename-pdf:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: orallix/clinical-report-stationery-v1
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Set branded filename
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          path = Path('src/perioPdf.ts')
          text = path.read_text()
          old = '  doc.save(`odontogram-report-${pdfStamp()}.pdf`);'
          new = '  doc.save(`ORALLIX-Clinical-Report-${pdfStamp().slice(0, 10)}.pdf`);'
          if old not in text:
              raise SystemExit('Expected PDF filename line not found')
          path.write_text(text.replace(old, new, 1))
          PY
      - run: npm ci
      - run: npm run build:lib
      - name: Commit source and dist
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/perioPdf.ts
          git add -f dist
          git commit -m "Brand ORALLIX clinical PDF filename"
          git push origin HEAD:orallix/clinical-report-stationery-v1
