name: Finalize ORALLIX clinical PDF

on:
  push:
    branches:
      - orallix/clinical-report-stationery-v1

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout stationery branch
        uses: actions/checkout@v4
        with:
          ref: orallix/clinical-report-stationery-v1
          fetch-depth: 0

      - name: Use repository Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Apply ORALLIX report refinements
        shell: python
        run: |
          from pathlib import Path

          index = Path('src/index.ts')
          text = index.read_text()
          old = '''      const logoPng = await loadOrallixLogoDataUrl();
      scopedHostReportData = {
        ...hostReportData,
        stationery: hostReportData.stationery ?? {
          logoPng,
          documentLabel: "Clinical Record Report",
          recordLabel: "Record number",
          recordValue:
            hostReportData.patient?.find(
              (row) => row.label.trim().toLowerCase() === "record number",
            )?.value ?? "",
          footerLabel:
            "Confidential clinical record · Authorized clinical use only",
          footerRight: "orallix.com",
        },
      };
'''
          new = '''      const logoPng = await loadOrallixLogoDataUrl();
      const recordValue =
        hostReportData.stationery?.recordValue?.trim() ||
        hostReportData.patient?.find((row) => {
          const label = row.label.trim().toLowerCase();
          return label === "record number" || label === "record no." || label === "record no";
        })?.value?.trim() ||
        "";

      scopedHostReportData = {
        ...hostReportData,
        stationery: {
          logoPng: hostReportData.stationery?.logoPng ?? logoPng,
          documentLabel:
            hostReportData.stationery?.documentLabel ?? "Clinical Record Report",
          recordLabel: hostReportData.stationery?.recordLabel ?? "Record number",
          recordValue,
          footerLabel:
            hostReportData.stationery?.footerLabel ?? "ORALLIX Clinical Record Report",
          footerRight: hostReportData.stationery?.footerRight ?? "orallix.com",
        },
      };
'''
          if old not in text:
            raise SystemExit('Expected index.ts stationery block not found')
          index.write_text(text.replace(old, new))

          pdf = Path('src/perioPdf.ts')
          text = pdf.read_text()
          old_palette = '''  const { header: C_HEADER, headerText: C_HEADER_TEXT, labelBg: C_LABEL_BG,
    rowBg: C_ROW_BG, rowAlt: C_ROW_ALT, border: C_BORDER, text: C_TEXT, muted: C_MUTED } = data.palette;
'''
          new_palette = '''  const { header: C_HEADER, headerText: C_HEADER_TEXT, labelBg: C_LABEL_BG,
    rowBg: C_ROW_BG, rowAlt: C_ROW_ALT, border: C_BORDER, text: C_TEXT, muted: C_MUTED } = data.palette;
  const C_SECTION_HEADER: RGB = stationery ? [11, 75, 114] : C_HEADER;
'''
          if old_palette not in text:
            raise SystemExit('Expected palette block not found')
          text = text.replace(old_palette, new_palette)
          old_bar = '''    fill(C_HEADER);
    doc.rect(MARGIN_MM, y, contentWidth, barH, "F");
'''
          new_bar = '''    fill(C_SECTION_HEADER);
    doc.rect(MARGIN_MM, y, contentWidth, barH, "F");
'''
          if old_bar not in text:
            raise SystemExit('Expected section bar fill not found')
          text = text.replace(old_bar, new_bar, 1)
          text = text.replace(
            'drawText(stationery.footerLabel || "ORALLIX Clinical Report", MARGIN_MM, pageHeight - 5.2);',
            'drawText(stationery.footerLabel || "ORALLIX Clinical Record Report", MARGIN_MM, pageHeight - 5.2);',
          )
          pdf.write_text(text)

      - name: Install dependencies
        run: npm ci

      - name: Build package dist
        run: npm run build:lib

      - name: Commit refined source and built dist
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/index.ts src/perioPdf.ts dist
          if git diff --cached --quiet; then
            echo "No PDF refinement changes to commit"
            exit 0
          fi
          git commit -m "Finalize ORALLIX clinical PDF presentation"
          git push origin HEAD:orallix/clinical-report-stationery-v1
