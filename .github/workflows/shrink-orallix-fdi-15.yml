name: Shrink ORALLIX PDF FDI by 15 percent

on:
  push:
    branches:
      - orallix/clinical-report-stationery-v1

permissions:
  contents: write

jobs:
  shrink-fdi:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout ORALLIX PDF branch
        uses: actions/checkout@v4
        with:
          ref: orallix/clinical-report-stationery-v1
          fetch-depth: 0

      - name: Use repository Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Apply exact 15 percent FDI reduction
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          path = Path('src/odontogram.ts')
          text = path.read_text()
          old = 'const TOOTH_NUMBER_SCALE: Record<PdfToothNumberSize, number> = { small: 1.5, normal: 2, xlarge: 2.6 };'
          new = 'const TOOTH_NUMBER_SCALE: Record<PdfToothNumberSize, number> = { small: 1.275, normal: 2, xlarge: 2.6 };'
          if old not in text:
              raise SystemExit('Expected tooth number scale map not found')
          path.write_text(text.replace(old, new, 1))
          PY

      - name: Install dependencies
        run: npm ci

      - name: Build library dist
        run: npm run build:lib

      - name: Commit source and dist
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/odontogram.ts dist
          if git diff --cached --quiet; then
            echo "No FDI size changes to commit"
            exit 0
          fi
          git commit -m "Reduce ORALLIX PDF FDI labels by 15 percent"
          git push origin HEAD:orallix/clinical-report-stationery-v1
